name: CD - Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - aggregator
          - user-service
          - document-service
          - notification-service
          - chat-service
          - quiz-service
          - tts-service
          - stt-service
          - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine service path
        id: service-path
        run: |
          case "${{ matrix.service }}" in
            chat-service)
              echo "dockerfile=platform/chat-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=." >> $GITHUB_OUTPUT
              ;;
            quiz-service)
              echo "dockerfile=platform/quiz-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=." >> $GITHUB_OUTPUT
              ;;
            document-service)
              echo "dockerfile=documentreader/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=." >> $GITHUB_OUTPUT
              ;;
            frontend)
              echo "dockerfile=frontend/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=frontend" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "dockerfile=${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=." >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: ${{ steps.service-path.outputs.dockerfile }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.service-path.outputs.context }}
          file: ${{ steps.service-path.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/thoth-${{ matrix.service }}:staging-latest
            ${{ steps.login-ecr.outputs.registry }}/thoth-${{ matrix.service }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy-to-swarm:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Swarm manager IP
        id: swarm-ip
        run: |
          MANAGER_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=staging" \
                      "Name=tag:Role,Values=swarm-manager" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' \
            --output text)
          echo "manager_ip=$MANAGER_IP" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ steps.swarm-ip.outputs.manager_ip }} >> ~/.ssh/known_hosts

      - name: Deploy to Docker Swarm
        run: |
          # Copy deployment files
          scp -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            .env.staging \
            scripts/health-check.sh \
            ec2-user@${{ steps.swarm-ip.outputs.manager_ip }}:/tmp/

          # Deploy with health monitoring
          ssh -i ~/.ssh/deploy_key ec2-user@${{ steps.swarm-ip.outputs.manager_ip }} << 'EOF'
            cd /tmp
            
            # Load environment
            set -a
            source .env.staging
            set +a
            
            export IMAGE_TAG=staging-${{ github.sha }}
            
            echo "📦 Deploying THOTH stack (staging)..."
            docker stack deploy \
              --compose-file docker-compose.prod.yml \
              --with-registry-auth \
              thoth-staging
            
            echo "⏳ Waiting for services to stabilize..."
            sleep 60
            
            # Run health check
            chmod +x health-check.sh
            ./health-check.sh thoth-staging
          EOF

      - name: Run smoke tests
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@${{ steps.swarm-ip.outputs.manager_ip }} << 'EOF'
            echo "🧪 Running smoke tests..."
            
            # Get ALB DNS from environment
            source /tmp/.env.staging
            
            # Test health endpoints
            SERVICES=("user" "aggregator" "document" "notification" "chat" "quiz")
            
            for service in "${SERVICES[@]}"; do
              URL="${ALB_DNS_NAME}/${service}/health"
              echo "Testing $URL..."
              
              if curl -f -s "$URL" > /dev/null; then
                echo "✅ $service health check passed"
              else
                echo "❌ $service health check failed"
                exit 1
              fi
            done
            
            echo "✅ All smoke tests passed!"
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

  notify:
    needs: deploy-to-swarm
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        run: |
          STATUS="${{ needs.deploy-to-swarm.result }}"
          if [ "$STATUS" == "success" ]; then
            echo "✅ Staging deployment successful - Ready for production promotion"
          else
            echo "❌ Staging deployment failed - Check logs"
            exit 1
          fi
