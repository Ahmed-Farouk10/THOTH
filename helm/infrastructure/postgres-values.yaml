# PostgreSQL Infrastructure - Production Configuration
# For standalone PostgreSQL deployment (if not using umbrella chart)

auth:
  username: postgres
  password: "CHANGE_ME_IN_PRODUCTION"
  database: postgres
  # Use existingSecret in production:
  # existingSecret: postgres-credentials

primary:
  persistence:
    enabled: true
    size: 50Gi
    storageClass: "gp3"  # AWS EBS gp3 volumes
  
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  
  # Initialize multiple databases
  initdb:
    scripts:
      init-databases.sql: |
        -- User Service Database
        CREATE DATABASE user_db;
        
        -- Quiz Service Database
        CREATE DATABASE quiz_db;
        
        -- Chat Service Database with pgvector
        CREATE DATABASE chat_db;
        \c chat_db;
        CREATE EXTENSION IF NOT EXISTS vector;
        
        -- Notification Service Database
        CREATE DATABASE notification_db;
        
        -- Grant privileges
        \c user_db;
        GRANT ALL PRIVILEGES ON DATABASE user_db TO postgres;
        
        \c quiz_db;
        GRANT ALL PRIVILEGES ON DATABASE quiz_db TO postgres;
        
        \c chat_db;
        GRANT ALL PRIVILEGES ON DATABASE chat_db TO postgres;
        
        \c notification_db;
        GRANT ALL PRIVILEGES ON DATABASE notification_db TO postgres;

# Backup configuration
backup:
  enabled: false  # Enable in production with S3 backup

# Monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: false  # Enable if using Prometheus Operator

# PostgreSQL configuration
postgresqlConfiguration:
  max_connections: "200"
  shared_buffers: "256MB"
  effective_cache_size: "1GB"
  maintenance_work_mem: "64MB"
  checkpoint_completion_target: "0.9"
  wal_buffers: "16MB"
  default_statistics_target: "100"
  random_page_cost: "1.1"  # For SSD storage
  effective_io_concurrency: "200"
  work_mem: "4MB"
