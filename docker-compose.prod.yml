# Docker Swarm Stack for Production Deployment
# Deploy with: docker stack deploy -c docker-compose.prod.yml thoth
version: '3.8'

services:
  # ============================================================================
  # API GATEWAY - NGINX
  # ============================================================================
  api-gateway:
    image: ${ECR_REGISTRY}/thoth-nginx:${IMAGE_TAG:-latest}
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    ports:
      - "80:80"
    networks:
      - platform-network
      - ingress-network
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================================
  # KAFKA CLUSTER - MSK in production, using Kafka for local testing
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - platform-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.kafka == true
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    networks:
      - platform-network
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.labels.kafka == true
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ============================================================================
  # USER SERVICE - Authentication & User Management
  # ============================================================================
  user-service:
    image: ${ECR_REGISTRY}/thoth-user-service:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://platformadmin:${USER_DB_PASSWORD}@${RDS_USER_ENDPOINT}:5432/user_management
      DB_HOST: ${RDS_USER_ENDPOINT}
      DB_PORT: 5432
      DB_NAME: user_management
      DB_USER: platformadmin
      KAFKA_BROKERS: ${MSK_BOOTSTRAP_SERVERS:-kafka:9092}
      SERVICE_NAME: user-service
      LOG_LEVEL: INFO
      AWS_REGION: ${AWS_REGION:-us-east-1}
    secrets:
      - jwt_secret
      - user_db_password
    networks:
      - platform-network
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # AGGREGATOR SERVICE - API Orchestration Layer
  # ============================================================================
  aggregator:
    image: ${ECR_REGISTRY}/thoth-aggregator:${IMAGE_TAG:-latest}
    environment:
      KAFKA_BROKERS: ${MSK_BOOTSTRAP_SERVERS:-kafka:9092}
      USER_SERVICE_URL: http://user-service:8000
      SERVICE_NAME: aggregator
      LOG_LEVEL: INFO
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_PREFIX: ${ENVIRONMENT:-prod}
    secrets:
      - jwt_secret
      - aws_access_key
      - aws_secret_key
    networks:
      - platform-network
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # DOCUMENT SERVICE - HTTP API
  # ============================================================================
  document-service:
    image: ${ECR_REGISTRY}/thoth-document-service:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://postgres:${DOCUMENT_DB_PASSWORD}@${RDS_DOCUMENT_ENDPOINT}:5432/document_reader_db
      KAFKA_BOOTSTRAP_SERVERS: ${MSK_BOOTSTRAP_SERVERS:-kafka:9092}
      S3_BUCKET_NAME: ${S3_DOCUMENTS_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SERVICE_NAME: document-service
      LOG_LEVEL: INFO
    secrets:
      - jwt_secret
      - document_db_password
      - aws_access_key
      - aws_secret_key
    networks:
      - platform-network
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # DOCUMENT WORKER - Background Processing
  # ============================================================================
  document-worker:
    image: ${ECR_REGISTRY}/thoth-document-service:${IMAGE_TAG:-latest}
    command: sh -c "cd /app/src && python worker.py"
    environment:
      DATABASE_URL: postgresql://postgres:${DOCUMENT_DB_PASSWORD}@${RDS_DOCUMENT_ENDPOINT}:5432/document_reader_db
      KAFKA_BOOTSTRAP_SERVERS: ${MSK_BOOTSTRAP_SERVERS:-kafka:9092}
      S3_BUCKET_NAME: ${S3_DOCUMENTS_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-models/gemini-1.5-pro}
      GOOGLE_API_BASE: ${GOOGLE_API_BASE:-https://generativelanguage.googleapis.com/v1beta}
      SPACY_MODEL: ${SPACY_MODEL:-en_core_web_sm}
      NOTES_MAX_CHARS: ${NOTES_MAX_CHARS:-15000}
      PRIMARY_GROQ_KEY: 5
      SERVICE_NAME: document-worker
      LOG_LEVEL: INFO
    secrets:
      - document_db_password
      - aws_access_key
      - aws_secret_key
      - groq_api_key_1
      - groq_api_key_2
      - groq_api_key_3
      - groq_api_key_4
      - groq_api_key_5
      - groq_api_key_6
      - google_api_key
    networks:
      - platform-network
    deploy:
      replicas: 5
      placement:
        constraints:
          - node.role == worker
          - node.labels.compute == high
      update_config:
        parallelism: 2
        delay: 30s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; exit(0 if os.path.exists(\"/proc/1\") else 1)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # NOTIFICATION SERVICE - Events & WebSocket
  # ============================================================================
  notification-service:
    image: ${ECR_REGISTRY}/thoth-notification-service:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://postgres:${NOTIFICATION_DB_PASSWORD}@${RDS_NOTIFICATION_ENDPOINT}:5432/notification_db
      KAFKA_BOOTSTRAP_SERVERS: ${MSK_BOOTSTRAP_SERVERS:-kafka:9092}
      SERVICE_NAME: notification-service
      LOG_LEVEL: INFO
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Phase 3: AWS SES
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-notifications@thoth.ai}
      SES_REGION: ${AWS_REGION:-us-east-1}
    secrets:
      - jwt_secret
      - notification_db_password
      - aws_access_key
      - aws_secret_key
    networks:
      - platform-network
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # QUIZ SERVICE - API
  # ============================================================================
  quiz-service:
    image: ${ECR_REGISTRY}/thoth-quiz-service:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://postgres:${QUIZ_DB_PASSWORD}@${RDS_QUIZ_ENDPOINT}:5432/quiz_db
      KAFKA_BOOTSTRAP_SERVERS: ${MSK_BOOTSTRAP_SERVERS:-kafka:9092}
      S3_BUCKET_NAME: ${S3_DOCUMENTS_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      PRIMARY_GROQ_KEY: 4
      SERVICE_NAME: quiz-service
      LOG_LEVEL: INFO
    secrets:
      - quiz_db_password
      - aws_access_key
      - aws_secret_key
      - groq_api_key_1
      - groq_api_key_2
      - groq_api_key_3
      - groq_api_key_4
      - groq_api_key_5
      - groq_api_key_6
    networks:
      - platform-network
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # QUIZ WORKER - Background Quiz Generation
  # ============================================================================
  quiz-worker:
    image: ${ECR_REGISTRY}/thoth-quiz-service:${IMAGE_TAG:-latest}
    command: sh -c "cd /app/src && python worker.py"
    environment:
      DATABASE_URL: postgresql://postgres:${QUIZ_DB_PASSWORD}@${RDS_QUIZ_ENDPOINT}:5432/quiz_db
      KAFKA_BOOTSTRAP_SERVERS: ${MSK_BOOTSTRAP_SERVERS:-kafka:9092}
      S3_BUCKET_NAME: ${S3_DOCUMENTS_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      PRIMARY_GROQ_KEY: 4
      SERVICE_NAME: quiz-worker
      LOG_LEVEL: INFO
    secrets:
      - quiz_db_password
      - aws_access_key
      - aws_secret_key
      - groq_api_key_1
      - groq_api_key_2
      - groq_api_key_3
      - groq_api_key_4
      - groq_api_key_5
      - groq_api_key_6
    networks:
      - platform-network
    deploy:
      replicas: 4
      placement:
        constraints:
          - node.role == worker
          - node.labels.compute == high
      update_config:
        parallelism: 2
        delay: 30s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; exit(0 if os.path.exists(\"/proc/1\") else 1)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # CHAT SERVICE - API with RAG
  # ============================================================================
  chat-service:
    image: ${ECR_REGISTRY}/thoth-chat-service:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://postgres:${CHAT_DB_PASSWORD}@${RDS_CHAT_ENDPOINT}:5432/chat_db
      KAFKA_BOOTSTRAP_SERVERS: ${MSK_BOOTSTRAP_SERVERS:-kafka:9092}
      S3_BUCKET_NAME: ${S3_DOCUMENTS_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SERVICE_NAME: chat-service
      LOG_LEVEL: INFO
    secrets:
      - chat_db_password
      - aws_access_key
      - aws_secret_key
      - chat_google_api_key
    networks:
      - platform-network
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # CHAT WORKER - Vector Embeddings & Document Ingestion
  # ============================================================================
  chat-worker:
    image: ${ECR_REGISTRY}/thoth-chat-service:${IMAGE_TAG:-latest}
    command: python src/worker.py
    environment:
      DATABASE_URL: postgresql://postgres:${CHAT_DB_PASSWORD}@${RDS_CHAT_ENDPOINT}:5432/chat_db
      KAFKA_BOOTSTRAP_SERVERS: ${MSK_BOOTSTRAP_SERVERS:-kafka:9092}
      S3_BUCKET_NAME: ${S3_DOCUMENTS_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SERVICE_NAME: chat-worker
      LOG_LEVEL: INFO
    secrets:
      - chat_db_password
      - aws_access_key
      - aws_secret_key
      - chat_google_api_key
    networks:
      - platform-network
    deploy:
      replicas: 4
      placement:
        constraints:
          - node.role == worker
          - node.labels.compute == high
      update_config:
        parallelism: 2
        delay: 30s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; exit(0 if os.path.exists(\"/proc/1\") else 1)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # TTS SERVICE - Text-to-Speech (Node.js)
  # ============================================================================
  tts-service:
    image: ${ECR_REGISTRY}/thoth-tts-service:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 8006
      TTS_PORT: 8006
      MONGODB_URI: ${DOCUMENTDB_URI}
      KAFKA_BROKERS: ${MSK_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CLIENT_ID: tts-service
      KAFKA_GROUP_ID: tts-service-group
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_DOCUMENTS_BUCKET}
    secrets:
      - aws_access_key
      - aws_secret_key
    networks:
      - platform-network
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8006/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # STT SERVICE - Speech-to-Text (Node.js + Gemini)
  # ============================================================================
  stt-service:
    image: ${ECR_REGISTRY}/thoth-stt-service:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 8007
      MONGODB_URI: ${DOCUMENTDB_URI}
      KAFKA_BROKERS: ${MSK_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CLIENT_ID: stt-service
      KAFKA_GROUP_ID: stt-service-group
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_DOCUMENTS_BUCKET}
    secrets:
      - aws_access_key
      - aws_secret_key
      - google_api_key
    networks:
      - platform-network
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8007/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # FRONTEND - React Application
  # ============================================================================
  frontend:
    image: ${ECR_REGISTRY}/thoth-frontend:${IMAGE_TAG:-latest}
    environment:
      VITE_API_BASE_URL: ${ALB_DNS_NAME}
      VITE_USER_SERVICE_URL: ${ALB_DNS_NAME}/user
      VITE_DOCUMENT_SERVICE_URL: ${ALB_DNS_NAME}/document
      VITE_NOTIFICATION_SERVICE_URL: ${ALB_DNS_NAME}/notification
      VITE_CHAT_SERVICE_URL: ${ALB_DNS_NAME}/chat
      VITE_QUIZ_SERVICE_URL: ${ALB_DNS_NAME}/quiz
      VITE_TTS_SERVICE_URL: ${ALB_DNS_NAME}/tts
      VITE_STT_SERVICE_URL: ${ALB_DNS_NAME}/stt
    networks:
      - platform-network
      - ingress-network
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ==============================================================================
# SECRETS - Managed via Docker Swarm secrets (sourced from AWS Secrets Manager)
# ==============================================================================
secrets:
  jwt_secret:
    external: true
  aws_access_key:
    external: true
  aws_secret_key:
    external: true
  user_db_password:
    external: true
  document_db_password:
    external: true
  notification_db_password:
    external: true
  quiz_db_password:
    external: true
  chat_db_password:
    external: true
  groq_api_key_1:
    external: true
  groq_api_key_2:
    external: true
  groq_api_key_3:
    external: true
  groq_api_key_4:
    external: true
  groq_api_key_5:
    external: true
  groq_api_key_6:
    external: true
  google_api_key:
    external: true
  chat_google_api_key:
    external: true

# ==============================================================================
# CONFIGS - Nginx configuration
# ==============================================================================
configs:
  nginx_config:
    external: true

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  platform-network:
    driver: overlay
    attachable: true
  ingress-network:
    driver: overlay
    attachable: true

# ==============================================================================
# VOLUMES - Kafka and Zookeeper need persistent storage
# ==============================================================================
volumes:
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
