# Alembic configuration file
# Alembic is a database migration tool for SQLAlchemy

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Database URL (can be overridden by environment variable)
sqlalchemy.url = postgresql://platformadmin:platformpass@user-db:5432/user_management

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

